<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Mi Tienda Web - Registro</title>
</head>
<body>

    <header>
        <h1>Mi Tienda Web</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Crear una Cuenta</h2>
            <form id="formRegistro">
                <div>
                    <label for="nombre">Nombre Completo:</label><br>
                    <input type="text" id="nombre" name="nombre" autocomplete="name">
                    <span id="errorNombre" style="color: red;"></span>
                </div>
                <br>
                <div>
                    <label for="email">Correo Electrónico:</label><br>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <span id="errorEmail" style="color: red;"></span>
                </div>
                <br>
                <div>
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" autocomplete="new-password">
                    <span id="errorPassword" style="color: red;"></span>
                </div>
                <br>
                <div>
                    <label for="confirmPassword">Confirmar Contraseña:</label><br>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
                    <span id="errorConfirmPassword" style="color: red;"></span>
                </div>
                <br>
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Tienda Web. Todos los derechos reservados.</p>
    </footer>
	
	<script src="assets/js/registro.js"></script>

</body>
</html>
