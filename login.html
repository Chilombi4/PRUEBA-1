<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Mi Tienda Web - Iniciar Sesión</title>
</head>
<body>

    <header>
        <h1>Mi Tienda Web</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Iniciar Sesión</h2>
            <form id="formLogin">
                <div>
                    <label for="loginEmail">Correo Electrónico:</label><br>
                    <input type="email" id="loginEmail" name="loginEmail" autocomplete="username">
                    <span id="errorLoginEmail" style="color: red;"></span>
                </div>
                <br>
                <div>
                    <label for="loginPassword">Contraseña:</label><br>
                    <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password">
                    <span id="errorLoginPassword" style="color: red;"></span>
                </div>
                <br>
                <button type="submit">Ingresar</button>
            </form>
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mi Tienda Web. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
